<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  body { width: 300px; margin: 0; padding: 12px; font: 14px/1.4 "Segoe UI", Arial, sans-serif; color: #1c1c1c; background: #fff; }
  button { width: 100%; padding: 10px; font: inherit; font-weight: 600; border: 1px solid #1c1c1c; border-radius: 6px; background: #1c1c1c; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  button.secondary { background: #fff; color: #1c1c1c; margin-top: 8px; font-weight: 400; }
  #status { min-height: 20px; margin: 10px 0 2px; font-size: 13px; }
  #status.ok { color: #1a7f37; } #status.err { color: #c62828; }
  #count { margin-top: 10px; color: #555; font-size: 13px; }
  .hint { margin-top: 10px; color: #777; font-size: 12px; }
</style>
</head>
<body>
  <button id="add">📰 Добавить статью в газету</button>
  <div id="status"></div>
  <div id="count"></div>
  <button id="open" class="secondary">Открыть список и сформировать газету</button>
  <div class="hint">Если текст определился неверно — выделите нужный фрагмент мышью и добавьте ещё раз. Быстрое добавление: Alt+Q.</div>
  <script src="pool.js"></script>
  <script src="popup.js"></script>
</body>
</html>
